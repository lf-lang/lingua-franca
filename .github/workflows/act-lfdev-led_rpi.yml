  removeimage:
    # Waits for every other job, then runs whatever happened to them:
    # succeeded, failed, skipped or cancelled.
    #Add other jobs to the needs list if they are added to this workflow.
    needs: [getdockerimage, flashblink1]
    if: needs.getdockerimage.result == 'success'
    timeout-minutes: 10
    runs-on: [self-hosted, linux, lf-act-rpi]
    steps:
      - name: Remove the Docker image
        run: |
          # Nothing to remove if an earlier job failed before loading it.
          if docker image inspect act-lf:act-lf-test-docker > /dev/null 2>&1; then
            docker image rm act-lf:act-lf-test-docker || true
          fi
          # Also remove older versions left without a name.
          docker image prune -f || true

  removeworkdir:
    # Waits for every other job, then runs whatever happened to them:
