  filecleanup:
    timeout-minutes: 60
    runs-on: [self-hosted, linux, lf-act-rpi]
    needs: pythonpackages
    steps:
      #- uses: actions/checkout@v5
      - name: Path Setup
        run: |
          ls ${{ github.workspace }}/act-lf-testbed 
          ls ${{ github.workspace }}/act-lf-testbed/test_lf_programs/*.sh
          ls ${{ github.workspace }}/act-lf-testbed/lf-3pi-template/
      - name: Copy Script
        working-directory: ${{ github.workspace }}/act-lf-testbed
        run: cp ${{ github.workspace }}/act-lf-testbed/test_lf_programs/*.sh ${{ github.workspace }}/act-lf-testbed/lf-3pi-template/
      - name: Run Script
        working-directory: ${{ github.workspace }}/act-lf-testbed/lf-3pi-template/
        run: |
          chmod +x cleanup.sh
          ./cleanup.sh

  filesetup:
    timeout-minutes: 60
    #if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, lf-act-rpi]
    needs: filecleanup
    steps:
      - name: Copy Files
        working-directory: ${{ github.workspace }}
        run: |
          #ls && ls src/
          cp ${{ github.workspace }}/act-lf-testbed/test_lf_programs/*.py ${{ github.workspace }}/act-lf-testbed/lf-3pi-template
          cp ${{ github.workspace }}/act-lf-testbed/test_lf_programs/Blink* ${{ github.workspace }}/act-lf-testbed/lf-3pi-template/src/

  getdockerimage:
    #timeout-minutes: 60
    runs-on: [self-hosted, linux, lf-act-rpi]
    needs: filesetup
    steps:
      - name: Get a token from the GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.act_client_id }}
          private-key: ${{ secrets.act_private_key }}
          owner: lf-lang
          repositories: act-lf-testbed
          permission-actions: read

      # This is not needed, since there is a nightly build for the image and there will be a new one for every PR, but it is here for a check later on if the image is not found.

      # The image comes from act-lf-testbed's "Image build and test" workflow,
      # not from this run, so look up the run that uploaded the newest copy.
      - name: Find the newest docker-image artifact
        id: find
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: 'lf-lang',
              repo: 'act-lf-testbed',
              name: 'docker-image',
              per_page: 100,
            });
            const newest = data.artifacts
              .filter((a) => !a.expired)
              .sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
            if (!newest) {
              core.setFailed('No docker-image artifact left in act-lf-testbed; run its "Image build and test" workflow first.');
              return;
            }
            core.info(`Using docker-image from run ${newest.workflow_run.id}, created ${newest.created_at}`);
            core.setOutput('run-id', newest.workflow_run.id);

      - name: Download docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image
          repository: lf-lang/act-lf-testbed
          run-id: ${{ steps.find.outputs.run-id }}
          github-token: ${{ steps.app-token.outputs.token }}
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/image.tar"
  
  compileblink1:
    timeout-minutes: 60
    runs-on: [self-hosted, linux, lf-act-rpi]
    needs: [getdockerimage]
    steps:
      - name: Compile Blink - 1
        working-directory: ${{ github.workspace }}/act-lf-testbed/lf-3pi-template
        #run: nix develop --command ${{ github.workspace }}/lingua-franca/bin/lfc-dev src/Blink_1.lf
        #run: docker run --rm "$IMAGE" lfc
        run: docker run --rm -v "${PWD}:/work" act-lf:act-lf-test-docker lfc src/Blink_1.lf 
  
  flashblink1:
    timeout-minutes: 60
    runs-on: [self-hosted, linux, lf-act-rpi]
    needs: [compileblink1]
    steps:
    - name: Flashing Blink
      working-directory: ${{ github.workspace }}/act-lf-testbed/lf-3pi-template
      run: nix develop --command picotool load -x bin/Blink_1.elf -f
  
