# Kubernetes Cluster Configuration for Federated Lingua Franca
# Make sure SSH key-based authentication is configured for all remote hosts.

# Private Docker Registry Configuration
registry:
  host: "workstation"      # Hostname or alias of the machine running the registry
  ip: "100.126.33.104"     # IP address of the registry machine
  port: 5000               # Port number on which the registry container will listen
  # user: "dongha"         # SSH username for the registry machine (optional, defaults to controlPlane.user if same host, or worker user if matching IP)

# Kubernetes Control Plane Configuration (k3s Server)
controlPlane:
  host: "workstation"      # Hostname or alias of the control plane machine
  ip: "100.126.33.104"     # IP address of the control plane machine
  user: "dongha"           # SSH username for the control plane machine

# Kubernetes Worker Nodes Configuration (k3s Agents running federates or RTI)
workers:
  # - host: "pi41"
  #   ip: "100.81.195.53"
  #   user: "pi41"
  #   lfHost: "100.81.195.53"
  - host: "pi42"           # SSH hostname or alias of the worker node
    ip: "100.111.215.39"   # IP address of the worker node
    user: "pi42"           # SSH username for the worker node
    lfHost: "100.111.215.39" # Target host identifier matching `.lf` "at" clauses (must be IP address for Pod nodeSelector matching)
  - host: "pi43"           # SSH hostname of the worker node
    ip: "100.123.107.48"   # IP address of the worker node
    user: "pi43"           # SSH username for the worker node
    lfHost: "100.123.107.48" # Target host identifier matching `.lf` "at" clauses (must be IP address for Pod nodeSelector matching)
  # Also available: pi44 100.105.7.52, pi45 100.127.112.77
